  }
  reportWindow.document.write('<p style="font-family:sans-serif;padding:24px;color:#5B6168;">Preparando relatório...</p>');

  const comodatoItem = (DB.options.equipamentos||[]).find(i=>i.label==='Máquina Skylack - Comodato');
  const propriaItem  = (DB.options.equipamentos||[]).find(i=>i.label==='Máquina Skylack - Própria');
  const balancaItem  = (DB.options.equipamentos||[]).find(i=>i.label==='Balança');

  const rows = [];
  for(const cl of DB.clients){
    const visits = await loadVisits(cl.id);
    if(!visits.length) continue;
    const last = [...visits].sort((a,b)=> a.date<b.date?1:-1)[0];
    const qty = last.qty || {};
    rows.push({
      name: cl.name,
      city: cl.city || '',
      date: last.date,
      comodato: comodatoItem ? (qty[comodatoItem.id] ?? 0) : 0,
      propria:  propriaItem  ? (qty[propriaItem.id]  ?? 0) : 0,
      balanca:  balancaItem  ? (qty[balancaItem.id]  ?? 0) : 0,
    });
  }
  rows.sort((a,b)=> a.name.localeCompare(b.name, 'pt-BR'));

  const totalComodato = rows.reduce((s,r)=> s+r.comodato, 0);
  const totalPropria  = rows.reduce((s,r)=> s+r.propria, 0);
  const totalBalanca  = rows.reduce((s,r)=> s+r.balanca, 0);

  const rowsHtml = rows.length ? rows.map(r=>`
    <tr>
      <td><b>${esc(r.name)}</b>${r.city? `<div class="eq-city">${esc(r.city)}</div>`:''}</td>
      <td class="eq-num">${r.comodato}</td>
      <td class="eq-num">${r.propria}</td>
      <td class="eq-num">${r.balanca}</td>
      <td class="eq-date">${fmtDate(r.date)}</td>
    </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:#9298A0;padding:24px;">Nenhum cliente com visita registrada ainda.</td></tr>`;

  const geradoEm = new Date().toLocaleDateString('pt-BR');

  const fullDoc = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório de Equipamentos - ${geradoEm}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>${REPORT_CSS}
  .eq-table{width:100%;border-collapse:collapse;margin-top:8px;}
  .eq-table th{
    font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;font-size:11.5px;letter-spacing:.03em;
    color:#5B6168;text-align:left;padding:8px 6px;border-bottom:2px solid #1B1E22;
  }
  .eq-table th.eq-num, .eq-table td.eq-num{text-align:center;}
  .eq-table td{padding:9px 6px;border-bottom:1px solid #F0F1F2;font-size:13.5px;vertical-align:top;}
  .eq-city{font-size:11px;color:#9298A0;margin-top:1px;}
  .eq-date{font-size:11.5px;color:#9298A0;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .eq-num{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .eq-table tfoot td{border-top:2px solid #1B1E22;border-bottom:none;font-weight:600;font-family:'IBM Plex Mono',monospace;}
  @media print{ .eq-table{ break-inside:auto; } .eq-table tr{ break-inside:avoid; } }
</style>
</head>
<body>
  <div class="report-toolbar">
    <button class="btn-close" onclick="window.close()">Fechar</button>
    <button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir / Salvar como PDF</button>
  </div>
  <div class="report-page">
    <div class="rp-brand">Relatório de Equipamentos</div>
    <h1>Todos os Clientes</h1>
    <div class="rp-meta">${rows.length} cliente(s) com visita registrada · valores do último registro de cada um · gerado em ${geradoEm}</div>

    <table class="eq-table">
      <thead>
        <tr>
          <th>Cliente</th>
          <th class="eq-num">Máquina Comodato</th>
          <th class="eq-num">Máquina Própria</th>
          <th class="eq-num">Balança</th>
          <th>Última visita</th>
        </tr>
      </thead>
      <tbody>${rowsHtml}</tbody>
      ${rows.length? `<tfoot><tr><td>Total</td><td class="eq-num">${totalComodato}</td><td class="eq-num">${totalPropria}</td><td class="eq-num">${totalBalanca}</td><td></td></tr></tfoot>`:''}
    </table>

    <div class="rp-footer">Relatório gerado automaticamente pelo app de Visita a Loja Parceira</div>
  </div>
</body>
</html>`;

  reportWindow.document.open();
  reportWindow.document.write(fullDoc);
  reportWindow.document.close();
}

/* ============================ MODAL ============================ */
function openModal({title, fields, onConfirm, hint}){
  const overlayId = 'modal-'+uid();
  const html = `
    <div class="modal-overlay" id="${overlayId}">
      <div class="modal-box">
        <div class="modal-title">${esc(title)}</div>
        ${hint?`<div class="modal-hint">${esc(hint)}</div>`:''}
        ${fields.map(f=>{
          if(f.type==='select'){
            return `
          <label class="field-label">${esc(f.label)}</label>
          <select id="mf-${f.key}" style="margin-bottom:10px">
            ${f.options.map(o=>`<option value="${esc(o.value)}" ${o.value===f.default?'selected':''}>${esc(o.label)}</option>`).join('')}
          </select>`;
          }
          if(f.type==='password'){
            return `
          <label class="field-label">${esc(f.label)}</label>
          <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" id="mf-${f.key}" placeholder="${esc(f.placeholder||'')}" style="margin-bottom:10px;letter-spacing:.3em;text-align:center;">`;
          }
          return `
          <label class="field-label">${esc(f.label)}</label>
          <input type="text" id="mf-${f.key}" placeholder="${esc(f.placeholder||'')}" style="margin-bottom:10px">`;
        }).join('')}
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal('${overlayId}')">Cancelar</button>
          <button class="btn primary" id="modal-confirm-${overlayId}">Salvar</button>
        </div>
      </div>
    </div>`;
  const div = document.createElement('div');
  div.innerHTML = html;
  document.body.appendChild(div.firstElementChild);
  const firstInput = document.getElementById('mf-'+fields[0].key);
  setTimeout(()=> firstInput && firstInput.focus(), 50);
  document.getElementById('modal-confirm-'+overlayId).onclick = async ()=>{
    const vals = {};
    fields.forEach(f=>{ vals[f.key] = document.getElementById('mf-'+f.key).value; });
    closeModal(overlayId);
    await onConfirm(vals);
  };
}
function closeModal(id){
  const el = document.getElementById(id);
  if(el) el.remove();
}

/* ---- Modal de confirmação (usado para ações destrutivas, como excluir visita) ---- */
function openConfirmModal({title, message, confirmLabel, danger, onConfirm}){
  const overlayId = 'confirm-'+uid();
  const html = `
    <div class="modal-overlay" id="${overlayId}">
      <div class="modal-box">
        <div class="modal-title">${esc(title)}</div>
        <div style="font-size:14px;color:var(--ink-soft);line-height:1.5;margin-bottom:16px;">${esc(message)}</div>
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal('${overlayId}')">Cancelar</button>
          <button class="btn ${danger?'danger':'primary'}" id="confirm-btn-${overlayId}">${esc(confirmLabel||'Confirmar')}</button>
        </div>
      </div>
    </div>`;
  const div = document.createElement('div');
  div.innerHTML = html;
  document.body.appendChild(div.firstElementChild);
  document.getElementById('confirm-btn-'+overlayId).onclick = async ()=>{
    closeModal(overlayId);
    await onConfirm();
  };
}

/* ============================ TRAVA DE ACESSO (tela de bloqueio) ============================ */
async function renderLockScreen(){
  const lc = state.lockConfig;
  const attempts = await getLockAttempts();
  const now = Date.now();
  const isLockedOut = attempts.lockedUntil && attempts.lockedUntil > now;
  const remaining = isLockedOut ? Math.ceil((attempts.lockedUntil - now)/1000) : 0;

  root.innerHTML = `
    <div class="lock-screen">
      <div class="lock-card">
        <div class="lock-badge">🔒</div>
        <div class="lock-title">Visita a Loja Parceira</div>
        <div class="lock-sub">Olá, <b>${esc(lc.name)}</b>. Digite seu PIN para continuar.</div>
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" id="lock-pin-input" class="lock-pin-input" placeholder="••••" ${isLockedOut?'disabled':''}>
        <div id="lock-error" class="lock-error" style="display:none;">PIN incorreto. Tente novamente.</div>
        <div id="lock-cooldown" class="lock-error" style="display:${isLockedOut?'block':'none'};">Muitas tentativas erradas. Aguarde <span id="lock-cooldown-secs">${remaining}</span>s para tentar de novo.</div>
        <button class="btn primary block" id="lock-enter-btn" style="margin-top:14px" onclick="attemptUnlock()" ${isLockedOut?'disabled':''}>Entrar</button>
        <div class="lock-recovery-link" onclick="openRecoveryModal()">Problemas para entrar?</div>
      </div>
    </div>`;
  const input = document.getElementById('lock-pin-input');
  if(input && !isLockedOut){
    setTimeout(()=> input.focus(), 50);
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') attemptUnlock(); });
  }
  if(isLockedOut){
    startLockCountdown(attempts.lockedUntil);
  }
}
function startLockCountdown(lockedUntil){
  const timer = setInterval(()=>{
    const secs = Math.ceil((lockedUntil - Date.now())/1000);
    const el = document.getElementById('lock-cooldown-secs');
    if(!el){ clearInterval(timer); return; }
    if(secs <= 0){
      clearInterval(timer);
      renderLockScreen();
      return;
    }
    el.textContent = secs;
  }, 1000);
}
async function attemptUnlock(){
  const input = document.getElementById('lock-pin-input');
  if(!input || input.disabled) return;
  const pin = (input.value||'').trim();
  if(!pin) return;
  const hash = await hashPin(pin);
  if(hash === state.lockConfig.pinHash){
    await resetLockAttempts();
    state.locked = false;
    await maybeShowWelcome();
  } else {
    const attempts = await registerFailedAttempt();
    input.value = '';
    if(attempts.lockedUntil && attempts.lockedUntil > Date.now()){
      renderLockScreen();
    } else {
      document.getElementById('lock-error').style.display = 'block';
      input.focus();
    }
  }
}

/* ---- recuperação: só quem sabe a frase secreta consegue definir um PIN novo.
   Não existe um botão que qualquer curioso possa apertar para simplesmente entrar. ---- */
function openRecoveryModal(){
  openModal({
    title:'Recuperar Acesso',
    hint:'Digite a frase de recuperação que você definiu ao configurar o PIN. Isso é diferente do PIN.',
    fields:[{key:'phrase', label:'Frase de recuperação', type:'password', placeholder:'Sua frase secreta'}],
    onConfirm: async (vals)=>{
      const phrase = (vals.phrase||'').trim();
      if(!phrase) return;
      const hash = await hashPin(phrase);
      if(hash !== state.lockConfig.recoveryHash){
        showToast('Frase de recuperação incorreta.');
        return;
      }
      openSetNewPinModal();
    }
  });
}
function openSetNewPinModal(){
  openModal({
    title:'Definir Novo PIN',
    hint:'Frase confirmada. Escolha um novo PIN de acesso.',
    fields:[
      {key:'pin', label:'Novo PIN (4 a 6 números)', type:'password', placeholder:'••••'},
      {key:'pin2', label:'Confirme o novo PIN', type:'password', placeholder:'••••'},
    ],
    onConfirm: async (vals)=>{
      const pin = (vals.pin||'').trim();
      if(!/^\d{4,6}$/.test(pin)){ showToast('O PIN deve ter de 4 a 6 números.'); return; }
      if(pin !== (vals.pin2||'').trim()){ showToast('Os PINs digitados não coincidem.'); return; }
      const pinHash = await hashPin(pin);
      const updated = { ...state.lockConfig, pinHash };
      await storageSet('app:lock', JSON.stringify(updated));
      state.lockConfig = updated;
      await resetLockAttempts();
      state.locked = false;
      showToast('PIN redefinido com sucesso.');
      render();
    }
  });
}
function openSetupPinModal(){
  closeMenuUI();
  openModal({
    title:'Proteger Acesso com PIN',
    hint:'Trava de abertura para evitar acesso casual de curiosos neste aparelho. Guarde bem a frase de recuperação — sem ela, ninguém (nem você) consegue redefinir o PIN se esquecer.',
    fields:[
      {key:'name', label:'Seu nome', placeholder:'Ex: João Silva'},
      {key:'pin', label:'Escolha um PIN (4 a 6 números)', type:'password', placeholder:'••••'},
      {key:'pin2', label:'Confirme o PIN', type:'password', placeholder:'••••'},
      {key:'recovery', label:'Frase de recuperação (só você deve saber)', placeholder:'Ex: nome do seu primeiro cachorro'},
    ],
    onConfirm: async (vals)=>{
      if(!vals.name || !vals.name.trim()){ showToast('Informe seu nome.'); return; }
      const pin = (vals.pin||'').trim();
      if(!/^\d{4,6}$/.test(pin)){ showToast('O PIN deve ter de 4 a 6 números.'); return; }
      if(pin !== (vals.pin2||'').trim()){ showToast('Os PINs digitados não coincidem.'); return; }
      if(!vals.recovery || vals.recovery.trim().length < 4){ showToast('Escolha uma frase de recuperação com pelo menos 4 letras.'); return; }
      await saveLockConfig(vals.name.trim(), pin, vals.recovery.trim());
      state.lockConfig = await getLockConfig();
      await resetLockAttempts();
      showToast('PIN configurado. Guarde bem sua frase de recuperação.');
      render();
    }
  });
}
function confirmRemovePin(){
  closeMenuUI();
  openConfirmModal({
    title:'Remover Proteção por PIN',
    message:'O app vai parar de pedir PIN ao abrir neste aparelho. Deseja continuar?',
    confirmLabel:'Remover PIN',
    danger:true,
    onConfirm: async ()=>{
      await clearLockConfig();
      state.lockConfig = null;
      showToast('Proteção por PIN removida.');
      render();
    }
  });
}

/* ============================ UTIL ============================ */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y.slice(2)}`;
}

/* ============================ BOOT ============================ */
async function maybeShowWelcome(){
  const setupDone = await storageGet('app:setupDone');
  if(!setupDone && DB.clients.length === 0){
    renderWelcomeScreen();
  } else {
    render();
  }
}
function renderWelcomeScreen(){
  root.innerHTML = `
    <div class="lock-screen">
      <div class="lock-card">
        <div class="lock-badge">👋</div>
        <div class="lock-title">Bem-vindo!</div>
        <div class="lock-sub">Este é o primeiro uso do app neste aparelho, sem nenhum dado ainda. Como você quer começar?</div>
        <button class="btn primary block" style="margin-top:6px" onclick="triggerWelcomeImport()">📥 Importar Backup Existente</button>
        <button class="btn ghost block" style="margin-top:10px" onclick="finishWelcome()">✨ Começar do Zero</button>
      </div>
    </div>`;
}
function triggerWelcomeImport(){
  document.getElementById('import-backup-input').click();
}
async function finishWelcome(){
  await storageSet('app:setupDone', '1');
  render();
}

(async function(){
  await loadAll();
  state.lockConfig = await getLockConfig();
  if(state.lockConfig){
    state.locked = true;
    await renderLockScreen();
  } else {
    await maybeShowWelcome();
  }
  if(storageMode==='memory'){
    setTimeout(()=> showToast('Aviso: este navegador não permite salvar dados — os registros serão perdidos ao fechar a página.'), 600);
  }
})();
</script>
