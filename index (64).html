<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visita a Loja Parceira</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Loja Parceira">
<meta name="theme-color" content="#E3E6FA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#EEF0F7;
    --header-tint:#E3E6FA;
    --paper:#FFFFFF;
    --ink:#1B1D2A;
    --ink-soft:#666B7C;
    --ink-faint:#9DA1B0;
    --accent:#5B4FE8;
    --accent-ink:#4238BD;
    --accent-soft:#EDECFC;
    --teal:#0FA894;
    --teal-soft:#E1F6F1;
    --good:#0FA894;
    --warn:#E8543E;
    --warn-soft:#FCEAE7;
    --line:#E5E7F0;
    --line-strong:#D2D5E3;
    --radius:16px;
    --shadow-sm:0 1px 2px rgba(27,29,42,.05);
    --shadow-md:0 14px 30px -14px rgba(27,29,42,.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Plus Jakarta Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .data{font-family:'IBM Plex Mono',monospace;}
  .stencil{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:0.01em;}
  #root{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:96px;position:relative;}

  /* ---------- header (camada própria, mais escura que o fundo) ---------- */
  .topbar{
    background:var(--header-tint);
    color:var(--ink);
    padding:16px 20px 18px;
    position:sticky;top:0;z-index:30;
    box-shadow:0 1px 0 rgba(27,29,42,.06);
  }
  .topbar .brand{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;
    font-size:18px;
    letter-spacing:-0.01em;
    display:flex;align-items:center;gap:9px;
  }
  .brand .chip{
    width:24px;height:24px;border-radius:8px;flex:none;display:flex;
    background:linear-gradient(155deg,var(--accent),#8B7FFF);
    box-shadow:var(--shadow-sm);
  }
  .topbar .sub{font-size:12px;color:var(--ink-soft);margin-top:3px;font-family:'Plus Jakarta Sans',sans-serif;}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;}
  .back-btn, .menu-btn{
    background:var(--paper);border:1px solid var(--line-strong);color:var(--ink);border-radius:10px;
    padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;
  }
  .back-btn:hover, .menu-btn:hover{border-color:var(--accent);color:var(--accent-ink);}

  /* ---------- generic (camada de conteúdo: fundo mais claro que o header) ---------- */
  .pad{padding:16px 18px;}
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:12px;
    box-shadow:var(--shadow-sm);
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    background:var(--ink);color:#fff;border:none;border-radius:11px;
    padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;
    font-family:'Plus Jakarta Sans',sans-serif;transition:transform .1s,box-shadow .15s;
  }
  .btn:hover{background:#000;box-shadow:var(--shadow-sm);}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent);}
  .btn.primary:hover{background:var(--accent-ink);}
  .btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line-strong);}
  .btn.ghost:hover{border-color:var(--ink);}
  .btn.danger{background:var(--warn);color:#fff;}
  .btn.danger:hover{background:#C33F2D;}
  .btn.block{width:100%;}
  .btn.sm{padding:6px 11px;font-size:11.5px;border-radius:9px;}
  .btn-row{display:flex;gap:7px;margin-top:7px;}
  .btn-row .add-item-btn{flex:1;margin-top:0;}
  input[type=text], input[type=date], textarea, select{
    width:100%;border:1px solid var(--line-strong);border-radius:11px;
    padding:10px 12px;font-size:13.5px;font-family:'Plus Jakarta Sans',sans-serif;
    background:var(--paper);color:var(--ink);
  }
  input[type=text]:focus, input[type=date]:focus, textarea:focus, select:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
  }
  textarea{resize:vertical;min-height:58px;}
  label.field-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;display:block;margin-bottom:6px;}
  .empty{
    text-align:center;color:var(--ink-faint);font-size:13px;padding:28px 14px;
  }

  /* ---------- home: client list ---------- */
  .client-card{
    display:flex;align-items:center;gap:12px;padding:12px 14px;
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .1s;
  }
  .client-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .gauge-mini{
    width:44px;height:44px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11.5px;
    background:conic-gradient(var(--teal) calc(var(--p)*1%), #E7E9F3 0);
    position:relative;
  }
  .gauge-mini::after{
    content:'';position:absolute;inset:5px;background:var(--paper);border-radius:50%;
  }
  .gauge-mini span{position:relative;z-index:2;}
  .client-info{flex:1;min-width:0;}
  .client-name{font-weight:700;font-size:14.5px;font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-.005em;}
  .client-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .client-meta.empty-visit{color:var(--ink-faint);font-style:italic;}
  .chev{color:var(--ink-faint);font-size:17px;}

  /* ---------- section accordion ---------- */
  .section{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:9px;overflow:hidden;box-shadow:var(--shadow-sm);
  }
  .section-head{
    display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;
    user-select:none;
  }
  .section-num{
    font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:12px;color:var(--ink-soft);
    background:var(--bg);width:24px;height:24px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .section.scored .section-num{background:var(--teal-soft);color:var(--teal);}
  .section.needs .section-num{background:var(--warn-soft);color:var(--warn);}
  .section-title{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-.005em;font-weight:700;font-size:14px;flex:1;}
  .section-progress{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .section-arrow{color:var(--ink-faint);transition:transform .15s;}
  .section.open .section-arrow{transform:rotate(180deg);}
  .section-body{padding:0 14px 14px;display:none;}
  .section.open .section-body{display:block;}

  .check-row{
    display:flex;align-items:center;gap:9px;padding:9px 2px;
    border-bottom:1px solid #F0F1F6;
  }
  .check-row:last-child{border-bottom:none;}
  .check-row input[type=checkbox]{
    width:18px;height:18px;flex:none;accent-color:var(--accent);cursor:pointer;
  }
  .check-row label{flex:1;font-size:13.5px;cursor:default;}
  .qty-input{
    width:50px;flex:none;text-align:center;border:1px solid var(--line-strong);border-radius:8px;
    padding:5px 4px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;margin-left:6px;
  }
  .qty-input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft);}
  .yn-select{
    flex:none;width:78px;text-align:center;border:1.5px solid var(--line-strong);border-radius:10px;
    padding:5px 6px;font-size:12px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;
    margin-left:8px;background:var(--paper);color:var(--ink-soft);
  }
  .yn-select.yn-empty{color:var(--ink-faint);}
  .yn-select.yn-yes{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  .yn-select.yn-no{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);}
  .prev-pending-tag{
    display:inline-block;font-size:9.5px;font-weight:700;color:var(--warn);
    background:var(--warn-soft);border-radius:999px;padding:1px 7px;margin-left:5px;
    vertical-align:middle;white-space:nowrap;
  }

  /* ---------- group (item with subitems) ---------- */
  .group{border-bottom:1px solid #F0F1F6;}
  .group:last-child{border-bottom:none;}
  .group-row{
    display:flex;align-items:center;gap:8px;padding:9px 2px;cursor:pointer;user-select:none;
  }
  .group-toggle{
    color:var(--accent);font-size:10px;transition:transform .15s;flex:none;width:12px;
  }
  .group.open .group-toggle{transform:rotate(90deg);}
  .group-label{font-size:13.5px;font-weight:700;flex:1;}
  .group-badge{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);
    background:var(--bg);border-radius:999px;padding:2px 8px;flex:none;
  }
  .group-body{
    display:none;padding:0 0 7px 20px;border-left:2px solid var(--line);margin-left:8px;
  }
  .group.open .group-body{display:block;}
  .group-body .check-row{padding:6px 2px;}
  .group-body .check-row label{font-size:13px;color:var(--ink-soft);}
  .add-subitem-btn{
    margin-top:4px;background:none;border:none;color:var(--accent-ink);
    font-size:12px;cursor:pointer;padding:4px 2px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;
  }
  .add-subitem-btn:hover{text-decoration:underline;}

  .add-item-btn{
    margin-top:7px;width:100%;background:none;border:1.5px dashed var(--line-strong);
    color:var(--ink-soft);border-radius:11px;padding:9px;font-size:12.5px;cursor:pointer;
    font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;
  }
  .add-item-btn:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);}
  .add-toggle-row{display:flex;justify-content:center;margin-top:6px;}
  .add-toggle{
    width:26px;height:26px;border-radius:50%;flex:none;
    border:1px solid var(--line-strong);background:var(--paper);color:var(--ink-faint);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;
    transition:transform .15s,color .15s,border-color .15s;
  }
  .add-toggle:hover{color:var(--accent-ink);border-color:var(--accent);}
  .add-toggle.open{transform:rotate(180deg);color:var(--accent-ink);border-color:var(--accent);}

  /* ---------- fotos da visita ---------- */
  .photo-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
  }
  .photo-tile{
    position:relative;aspect-ratio:1/1;border-radius:11px;overflow:hidden;
    border:1px solid var(--line);background:var(--bg);
  }
  .photo-tile img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-tile-actions{
    position:absolute;top:4px;right:4px;display:flex;gap:4px;
  }
  .photo-btn{
    width:22px;height:22px;border-radius:7px;background:rgba(27,29,42,.72);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;text-decoration:none;
    border:none;cursor:pointer;
  }
  .photo-btn-del:hover{background:var(--warn);}

  .stars{display:flex;gap:5px;margin:5px 0 10px;}
  .star{font-size:27px;color:#DEE0EA;cursor:pointer;line-height:1;}
  .star.on{color:var(--accent);}

  /* ---------- sticky score bar ---------- */
  .scorebar{
    position:fixed;bottom:0;left:0;right:0;background:var(--paper);
    border-top:1px solid var(--line);padding:11px 18px;
    display:flex;align-items:center;gap:11px;z-index:40;
    max-width:560px;margin:0 auto;box-shadow:0 -8px 24px -12px rgba(27,29,42,.12);
  }
  .scorebar .gauge{
    width:44px;height:44px;border-radius:50%;flex:none;position:relative;
    background:conic-gradient(var(--teal) calc(var(--p)*1%), #E7E9F3 0);
  }
  .scorebar .gauge::after{content:'';position:absolute;inset:5px;background:var(--paper);border-radius:50%;}
  .scorebar .gauge span{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;z-index:2;
  }
  .scorebar .lbl{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .scorebar .lbl b{display:block;font-size:12.5px;color:var(--ink);font-family:'IBM Plex Mono',monospace;}

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(27,29,42,.5);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);
  }
  .modal-box{
    background:var(--paper);border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:560px;
    animation:slideup .18s ease-out;
  }
  @keyframes slideup{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-title{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;margin-bottom:11px;letter-spacing:-.01em;}
  .modal-hint{font-size:11.5px;color:var(--ink-soft);margin:-5px 0 11px;}
  .modal-actions{display:flex;gap:9px;margin-top:13px;}
  .modal-actions .btn{flex:1;}

  /* ---------- menu lateral (usa a mesma cor de camada do header) ---------- */
  .menu-overlay{
    position:fixed;inset:0;background:rgba(27,29,42,.45);z-index:150;
    display:flex;justify-content:flex-start;backdrop-filter:blur(2px);
  }
  .menu-panel{
    background:var(--paper);color:var(--ink);width:80%;max-width:296px;height:100%;
    padding:0 0 20px;animation:slidein .18s ease-out;display:flex;flex-direction:column;
    box-shadow:var(--shadow-md);
  }
  @keyframes slidein{from{transform:translateX(-16px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  .menu-header{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--header-tint);padding:20px 18px 16px;margin-bottom:14px;
  }
  .menu-brand{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
  .menu-brand .chip{width:20px;height:20px;border-radius:7px;background:linear-gradient(155deg,var(--accent),#8B7FFF);display:inline-block;}
  .menu-close{background:var(--paper);border:none;color:var(--ink-soft);font-size:14px;cursor:pointer;line-height:1;padding:6px 9px;border-radius:999px;}
  .menu-item{
    display:flex;align-items:center;gap:11px;padding:10px 18px;border-radius:0;
    background:none;border:none;color:var(--ink);font-size:13.5px;font-weight:600;text-align:left;cursor:pointer;
    font-family:'Plus Jakarta Sans',sans-serif;width:100%;
  }
  .menu-item:hover{background:var(--bg);}
  .menu-item .menu-icon{
    font-size:15px;width:29px;height:29px;border-radius:9px;background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .menu-divider{height:1px;background:var(--line);margin:9px 18px;}
  .menu-footer{margin-top:auto;font-size:10.5px;color:var(--ink-faint);text-align:center;padding-top:14px;}

  /* ---------- history ---------- */
  .visit-row{
    display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid #F0F1F6;
    cursor:pointer;
  }
  .visit-row:last-child{border-bottom:none;}
  .visit-date{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;width:74px;flex:none;}
  .trend-bar-wrap{flex:1;background:var(--bg);height:6px;border-radius:999px;overflow:hidden;}
  .trend-bar{height:100%;background:var(--teal);border-radius:999px;}
  .visit-score{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;width:36px;text-align:right;}

  /* ---------- detail / summary ---------- */
  .summary-stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F0F1F6;font-size:13px;}
  .summary-stat:last-child{border-bottom:none;}
  .pill{
    display:inline-block;font-size:10.5px;background:var(--bg);color:var(--ink-soft);
    border-radius:999px;padding:3px 9px;margin:2px 4px 2px 0;font-family:'IBM Plex Mono',monospace;
  }
  .need-row{
    display:flex;align-items:flex-start;gap:9px;padding:7px 2px;border-bottom:1px solid #F9DAD3;
  }
  .need-row:last-child{border-bottom:none;}
  .need-dot{
    width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none;margin-top:5px;
  }
  .need-label{font-size:13px;font-weight:700;color:var(--ink);}
  .need-section{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  .gauge-big{
    width:122px;height:122px;border-radius:50%;margin:4px auto 4px;position:relative;
    background:conic-gradient(var(--teal) calc(var(--p)*1%), #E7E9F3 0);
  }
  .gauge-big::after{content:'';position:absolute;inset:10px;background:var(--paper);border-radius:50%;}
  .gauge-big .val{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;
  }
  .gauge-big .val b{font-family:'IBM Plex Mono',monospace;font-size:27px;}
  .gauge-big .val small{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}

  .section-title-row{display:flex;align-items:center;gap:8px;margin:16px 0 7px;}
  .section-title-row .line{flex:1;height:1px;background:var(--line);}
  .section-title-row h3{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-.005em;font-size:12px;margin:0;color:var(--ink-soft);font-weight:700;}

  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:12.5px;
    z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:var(--shadow-md);
  }
  .toast.show{opacity:1;}
  .loading{text-align:center;padding:60px 20px;color:var(--ink-faint);font-size:13px;}

  /* ---------- client hero (nome do cliente em destaque) ---------- */
  .client-hero{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm);
  }
  .client-hero .hero-label{
    font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:700;
  }
  .client-hero .hero-name{
    font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;
    font-size:21px;letter-spacing:-.01em;color:var(--ink);line-height:1.15;margin-top:3px;
  }
  .client-hero .hero-city{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}

  /* ---------- busca de cliente (autocomplete) ---------- */
  .client-search-input{
    margin-top:8px;font-size:15px;font-weight:600;
  }
  .client-search-results{
    display:none;position:absolute;left:18px;right:18px;top:100%;margin-top:4px;
    background:var(--paper);border:1px solid var(--line-strong);border-radius:12px;
    box-shadow:var(--shadow-md);max-height:260px;overflow-y:auto;z-index:60;
  }
  .client-suggestion{
    padding:10px 14px;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:8px;
  }
  .client-suggestion:last-child{border-bottom:none;}
  .client-suggestion:hover{background:var(--bg);}
  .client-suggestion .cs-name{font-weight:600;color:var(--ink);}
  .client-suggestion .cs-city{font-size:11.5px;color:var(--ink-soft);}
  .client-suggestion-empty{color:var(--ink-faint);font-style:italic;cursor:default;}
  .client-suggestion-empty:hover{background:none;}
  .client-suggestion-new{color:var(--accent-ink);font-weight:700;}

  /* ---------- relatório (tela de impressão / PDF) ---------- */
  .report-overlay{
    position:fixed;inset:0;background:#fff;z-index:500;overflow:auto;display:none;
  }
  .report-overlay.show{display:block;}
  .report-toolbar{
    position:sticky;top:0;background:var(--ink);padding:11px 16px;display:flex;gap:9px;z-index:2;
  }
  .report-toolbar .btn{flex:1;}

/* each leaf carries an optional flag:
   'positive' -> quando marcado, conta A FAVOR do Índice de Presença e Atendimento
   'need'     -> quando marcado, entra automaticamente na lista de Necessidades de Melhoria da visita
   null/undefined -> apenas informativo (não entra em nenhum cálculo) */
function it(label, subs, flag){
  const subitems = (subs||[]).map(s=>{
    if(typeof s === 'string') return {id:uid(), label:s, flag: flag||null};
    return {id:uid(), label:s.label, flag: s.flag||null};

}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function leavesOf(item){ return (item.subitems && item.subitems.length) ? item.subitems : [item]; }

/* ---- STORAGE LAYER ----
   Dentro do preview do Claude usa window.storage (persistente na conta).
   Fora do Claude (arquivo baixado, hospedado no seu site, etc) usa localStorage do navegador.
   Se nada estiver disponível (ex: aba anônima bloqueando storage), usa memória só da sessão atual. */
let storageMode = 'memory';
const memoryStore = {};
const LS_PREFIX = 'auditoria-pdv:';

async function detectStorage(){
  if(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set === 'function'){
    try{
      await window.storage.set('__probe__', '1', false);
      storageMode = 'claude';
      return;
    }catch(e){ /* segue tentando localStorage */ }
  }
  try{
    localStorage.setItem(LS_PREFIX+'__probe__', '1');
    localStorage.removeItem(LS_PREFIX+'__probe__');
    storageMode = 'local';
    return;
  }catch(e){ /* localStorage indisponível */ }
  storageMode = 'memory';
}

async function storageGet(key){
  if(storageMode==='claude'){
    try{ const r = await window.storage.get(key); return r ? r.value : null; }
    catch(e){ return null; }
  }
  if(storageMode==='local'){
    return localStorage.getItem(LS_PREFIX+key);
  }
  return (key in memoryStore) ? memoryStore[key] : null;
}
async function storageSet(key, value){
  if(storageMode==='claude'){
    try{ await window.storage.set(key, value, false); return; }catch(e){ /* cai pro próximo modo numa próxima tentativa */ }
  }
  if(storageMode==='local'){
    try{ localStorage.setItem(LS_PREFIX+key, value); return; }catch(e){ /* segue */ }
  }
  memoryStore[key] = value;
}
async function storageDelete(key){
  if(storageMode==='claude'){
    try{ await window.storage.delete(key, false); return; }catch(e){ /* segue */ }
  }
  if(storageMode==='local'){
    try{ localStorage.removeItem(LS_PREFIX+key); return; }catch(e){ /* segue */ }
  }
  delete memoryStore[key];
}

/* ---- TRAVA DE ACESSO (PIN + nome + frase de recuperação) ----
   Proteção contra acesso casual (alguém pegar o aparelho destravado e abrir o app
   por curiosidade). NÃO é criptografia forte: os dados de clientes/visitas
   continuam sem criptografia por baixo — isso é uma trava de abertura, não um
   cofre. PIN e frase de recuperação ficam salvos como hash (SHA-256), nunca em
   texto puro. Não existe botão de "esqueci o PIN" que qualquer um possa apertar:
   só quem souber a frase de recuperação consegue definir um PIN novo. Depois de
   várias tentativas erradas seguidas, o app bloqueia novas tentativas por um
   tempo que aumenta a cada nova falha. */
async function hashPin(text){
  const enc = new TextEncoder();
  const data = enc.encode('vlp-lock-salt::' + text.trim().toLowerCase());
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function getLockConfig(){
  try{
    const raw = await storageGet('app:lock');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function saveLockConfig(name, pin, recoveryPhrase){
  const pinHash = await hashPin(pin);
  const recoveryHash = await hashPin(recoveryPhrase);
  await storageSet('app:lock', JSON.stringify({name, pinHash, recoveryHash, createdAt:new Date().toISOString()}));
}
async function clearLockConfig(){
  await storageDelete('app:lock');
  await storageDelete('app:lock:attempts');
}

/* ---- controle de tentativas: bloqueia por tempo crescente após erros seguidos ---- */
async function getLockAttempts(){
  try{
    const raw = await storageGet('app:lock:attempts');
    return raw ? JSON.parse(raw) : {count:0, lockedUntil:0};
  }catch(e){ return {count:0, lockedUntil:0}; }
}
async function saveLockAttempts(data){
  await storageSet('app:lock:attempts', JSON.stringify(data));
}
async function registerFailedAttempt(){
  const a = await getLockAttempts();
  a.count = (a.count||0) + 1;
  if(a.count >= 5){
    const extra = a.count - 5;
    const seconds = Math.min(30 * Math.pow(2, extra), 600); // cresce até um teto de 10 min
    a.lockedUntil = Date.now() + seconds*1000;
  }
  await saveLockAttempts(a);
  return a;
}
async function resetLockAttempts(){
  await saveLockAttempts({count:0, lockedUntil:0});
}

let DB = { clients: [], options: null };
let VISITS_CACHE = {}; // clientId -> array of visits

async function loadAll(){
  await detectStorage();
  try{
    const c = await storageGet('app:clients');
    DB.clients = c ? JSON.parse(c) : [];
  }catch(e){ DB.clients = []; }
  try{
    const o = await storageGet('app:options');
    DB.options = o ? JSON.parse(o) : buildDefaultOptions();
  }catch(e){ DB.options = buildDefaultOptions(); }
  const defaults = buildDefaultOptions();
  Object.keys(defaults).forEach(k=>{ if(!DB.options[k]) DB.options[k] = defaults[k]; });
  // make sure every item has a subitems array (for options saved by older version)
  Object.values(DB.options).forEach(arr=>{
    arr.forEach(i=>{ if(!i.subitems) i.subitems = []; });
  });
  // migração: garante a caixa de quantidade nesses itens de equipamento mesmo em dados salvos antes dessa função existir
  const QTY_ITEM_LABELS = ['Máquina Skylack - Comodato', 'Máquina Skylack - Própria', 'Balança'];
  (DB.options.equipamentos||[]).forEach(item=>{
    if(QTY_ITEM_LABELS.includes(item.label)) item.qty = true;
  });
  // migração: ajustes de conteúdo pedidos no bloco "Estrutura da Loja" (aplica a dados já salvos)
  (function migrateEstrutura(){
    const arr = DB.options.estrutura || [];
    const fachada = arr.find(i=> i.label === 'Fachada');
    if(fachada) fachada.subitems = (fachada.subitems||[]).filter(su=> su.label !== 'Iluminação adequada');

    const interior = arr.find(i=> i.label === 'Interior da Loja');
    if(interior){
      interior.subitems = (interior.subitems||[]).filter(su=> !['Produtos expostos','Área de atendimento'].includes(su.label));
      if(!interior.subitems.some(su=> su.label === 'Produto Skylack exposto')){
        interior.subitems.push({id:uid(), label:'Produto Skylack exposto', flag:'positive'});
      }
    }

    const oficina = arr.find(i=> i.label === 'Oficina de Demonstração' || i.label === 'Bancada de Colorimetria');
    if(oficina){
      oficina.label = 'Bancada de Colorimetria';
      if(!oficina.subitems.some(su=> su.label === 'Testa tinta MIX')){
        oficina.subitems.push({id:uid(), label:'Testa tinta MIX', flag:'positive'});
      }
    }
  })();
  (function migratePresencaEtc(){
    // PRESENÇA DA MARCA
    const pres = DB.options.presenca || [];
    const banner = pres.find(i=> i.label === 'Banner');
    if(banner) banner.subitems = (banner.subitems||[]).filter(su=> !['Promocional','Linha de Polimento','Linha de Pintura'].includes(su.label));
    DB.options.presenca = pres.filter(i=> !['Totem','Faixa promocional','Display de balcão'].includes(i.label));
    const matTecnico = DB.options.presenca.find(i=> i.label === 'Material técnico');
    if(matTecnico) matTecnico.label = "Folder's";
    if(!DB.options.presenca.some(i=> i.label === 'Manuais técnicos')){
      DB.options.presenca.push({id:uid(), label:'Manuais técnicos', subitems:[], flag:'positive'});
    }

    // EXPOSIÇÃO DOS PRODUTOS
    const probl = (DB.options.exposicao||[]).find(i=> i.label === 'Problemas Identificados');
    if(probl) probl.subitems = (probl.subitems||[]).filter(su=> su.label !== 'Produtos escondidos');

    // CONCORRÊNCIA
    const materiais = (DB.options.concorrentes||[]).find(i=> i.label === 'Materiais e Preços');
    if(materiais) materiais.subitems = (materiais.subitems||[]).filter(su=> su.label !== 'Ocupa mais espaço que nós');

    // EQUIPAMENTOS
    const estadoMaquina = (DB.options.equipamentos||[]).find(i=> i.label === 'Estado da Máquina (se Comodato)');
    if(estadoMaquina){
      if(!estadoMaquina.subitems.some(su=> su.label === 'Limpeza')){
        estadoMaquina.subitems.push({id:uid(), label:'Limpeza', flag:'positive'});
      }
      if(!estadoMaquina.subitems.some(su=> su.label === 'Produtos estranhos a marca')){
        estadoMaquina.subitems.push({id:uid(), label:'Produtos estranhos a marca', flag:'need'});
      }
    }

    // CAMPANHAS
    DB.options.campanhas = (DB.options.campanhas||[]).filter(i=> !['Material instalado','Cliente conhece a campanha'].includes(i.label));

    // PENDÊNCIAS DA VISITA
    const enviarMaterial = (DB.options.pendencias||[]).find(i=> i.label === 'Enviar material');
    if(enviarMaterial) enviarMaterial.subitems = (enviarMaterial.subitems||[]).filter(su=> su.label !== 'Material de merchandising');

    // remove duplicidades entre "Pendências da Visita" e "Oportunidades" (Cliente solicitou):
    // Visita técnica e Solicitar treinamento já são capturados em Oportunidades; Catálogo e
    // Banner de "Enviar material" também já são capturados lá. Mantém Decalque, Cotação e
    // Ajustar exposição, que não têm equivalente em outro bloco.
    DB.options.pendencias = (DB.options.pendencias||[]).filter(i=> !['Visita técnica','Solicitar treinamento'].includes(i.label));
    const enviarMaterial2 = DB.options.pendencias.find(i=> i.label === 'Enviar material');
    if(enviarMaterial2){
      enviarMaterial2.subitems = (enviarMaterial2.subitems||[]).filter(su=> !['Catálogo','Banner'].includes(su.label));
    }
  })();

  // limpeza: remove itens duplicados (mesmo nome repetido) em TODOS os blocos — isso pode
  // acontecer se um backup de outro aparelho/sessão foi importado e duplicou a lista inteira,
  // já que cada instalação nova gera ids aleatórios diferentes para os mesmos itens padrão.
  // Mantém sempre a primeira ocorrência de cada nome (preserva o vínculo com visitas antigas).
  (function dedupeAllOptions(){
    function dedupeItems(items){
      const seen = new Set();
      const result = [];
      (items||[]).forEach(item=>{
        const key = (item.label||'').trim().toLowerCase();
        if(seen.has(key)) return; // já existe um item com este nome — descarta a repetição
        seen.add(key);
        if(item.subitems && item.subitems.length){
          const subSeen = new Set();
          item.subitems = item.subitems.filter(su=>{
            const sk = (su.label||'').trim().toLowerCase();
            if(subSeen.has(sk)) return false;
            subSeen.add(sk);
            return true;
          });
        }
        result.push(item);
      });
      return result;
    }
    Object.keys(DB.options).forEach(key=>{
      DB.options[key] = dedupeItems(DB.options[key]);
    });
  })();
  await saveOptions(); // grava as migrações acima, para não depender de reaplicá-las em memória a cada abertura

  // limpeza: remove definitivamente clientes de teste específicos (e suas visitas/fotos),
  // toda vez que o app abre — evita que voltem a aparecer mesmo se o ambiente de teste
  // recarregar um retrato antigo dos dados.
  const TEST_CLIENT_NAMES = ['patati', 'pav - ananindeua'];
  const toRemove = DB.clients.filter(c=> TEST_CLIENT_NAMES.includes((c.name||'').trim().toLowerCase()));
  if(toRemove.length){
    for(const c of toRemove){
      const visits = await loadVisits(c.id);
      for(const v of visits){
        for(const pid of (v.photos||[])){
          await deletePhotoData(v.id, pid);
        }
      }
      await storageDelete('visits:'+c.id);
      delete VISITS_CACHE[c.id];
    }
    DB.clients = DB.clients.filter(c=> !TEST_CLIENT_NAMES.includes((c.name||'').trim().toLowerCase()));
    await saveClients();
  }
}
async function saveClients(){

  }

    const v = await storageGet('visits:'+clientId);
    VISITS_CACHE[clientId] = v ? JSON.parse(v) : [];

/* ---- FOTOS DA VISITA ----
   Cada foto fica salva em sua PRÓPRIA chave (photo:<visitId>:<photoId>), separada
   da lista de visitas. Isso evita que o registro de visitas fique gigante conforme
   o número de fotos cresce, já que cada chave de armazenamento tem limite de tamanho. */
function resizeImageFile(file){
  return new Promise((resolve, reject)=>{
    if(!file.type || !file.type.startsWith('image/')){ reject(new Error('not-image')); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1280;
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = ()=> reject(new Error('img-decode-failed'));
      img.src = e.target.result;
    };
    reader.onerror = ()=> reject(new Error('file-read-failed'));
    reader.readAsDataURL(file);
  });
}

function sectionTotal(sectionKey){
  return (DB.options[sectionKey]||[]).reduce((sum,i)=> sum + leavesOf(i).length, 0);
}

/* ---- RESPOSTA POR ITEM: 'yes' | 'no' | '' (vazio = ainda não avaliado) ----
   Compatível com visitas antigas, salvas antes desta função existir, onde
   v.checks[sectionKey] era uma lista de ids marcados (equivalia a 'yes'). */
function getAnswer(v, sectionKey, itemId){
  const c = v.checks[sectionKey];
  if(Array.isArray(c)) return c.includes(itemId) ? 'yes' : '';
  return (c && c[itemId]) || '';
}
function setAnswer(v, sectionKey, itemId, value){
  if(!v.checks) v.checks = {};
  if(Array.isArray(v.checks[sectionKey])){
    // migra o formato antigo (lista) para o novo (objeto) na primeira edição
    const obj = {};
    v.checks[sectionKey].forEach(id=> obj[id] = 'yes');
    v.checks[sectionKey] = obj;
  }
  if(!v.checks[sectionKey]) v.checks[sectionKey] = {};
  if(value) v.checks[sectionKey][itemId] = value;
  else delete v.checks[sectionKey][itemId];
}
function sectionChecked(v, sectionKey){
  let n = 0;
  (DB.options[sectionKey]||[]).forEach(item=>{
    leavesOf(item).forEach(leaf=>{ if(getAnswer(v, sectionKey, leaf.id)==='yes') n++; });
  });
  return n;
}
/* Índice de Presença e Atendimento: percentual de itens marcados 'positive' (em
   qualquer bloco) que estão de fato marcados como Sim nesta visita. */
function presencaScore(visit){
  let total = 0, checked = 0;
  SECTIONS.forEach(s=>{
    (DB.options[s.key]||[]).forEach(item=>{
      leavesOf(item).forEach(leaf=>{
        if(leaf.flag === 'positive'){
          total++;
          if(getAnswer(visit, s.key, leaf.id)==='yes') checked++;
        }
      });
    });
  });
  return total ? Math.round((checked/total)*100) : 0;
}
/* Necessidades de Melhoria: itens marcados 'need' que foram marcados como Sim nesta
   visita — cada um vira automaticamente um alerta no resultado e no relatório. */
function improvementNeeds(visit){
  const list = [];
  SECTIONS.forEach(s=>{
    (DB.options[s.key]||[]).forEach(item=>{
      leavesOf(item).forEach(leaf=>{
        if(leaf.flag === 'need' && getAnswer(visit, s.key, leaf.id)==='yes'){
          const label = (item.subitems && item.subitems.length) ? `${item.label} · ${leaf.label}` : leaf.label;
          list.push({section: s.title, label});
        }
      });
    });
  });
  return list;
}
/* Follow-Up: TODO item de TODO bloco que ainda não foi marcado Sim — ou seja,
   ficou vazio (não avaliado) ou foi explicitamente marcado Não. */
function followUpItems(visit){
  const list = [];
  SECTIONS.forEach(s=>{
    (DB.options[s.key]||[]).forEach(item=>{
      leavesOf(item).forEach(leaf=>{
        const ans = getAnswer(visit, s.key, leaf.id);
        if(ans !== 'yes'){
          const label = (item.subitems && item.subitems.length) ? `${item.label} · ${leaf.label}` : leaf.label;
          list.push({section: s.title, label, status: ans==='no' ? 'Não' : 'Não avaliado'});
        }
      });
    });
  });
  return list;
}

/* ---- COMPARAR COM A VISITA ANTERIOR ----
   Retorna um Set com os ids de todos os itens que ficaram pendentes (vazios ou "Não")
   na visita anterior do mesmo cliente, para marcar um lembrete visual na visita atual. */
function pendingIdSet(visit){
  const set = new Set();
  if(!visit) return set;
  SECTIONS.forEach(s=>{
    (DB.options[s.key]||[]).forEach(item=>{
      leavesOf(item).forEach(leaf=>{
        if(getAnswer(visit, s.key, leaf.id) !== 'yes') set.add(leaf.id);
      });
    });
  });
  return set;
}
async function loadPreviousVisitPending(clientId, excludeVisitId){
  if(!clientId) return new Set();
  const visits = await loadVisits(clientId);
  const sorted = [...visits].sort((a,b)=> a.date < b.date ? 1 : -1);
  const previous = sorted.find(v=> v.id !== excludeVisitId);
  return pendingIdSet(previous);
}

/* ---- IMPORTAR CLIENTES DE PLANILHA (Excel) ----
   Lê colunas "Loja" (nome) e "Município"/"Municipio" (cidade). Se existir uma coluna
   de código (ex: "Id_Loja"), usa como identificador único para reconhecer, numa nova
   importação, quais lojas já existem (e apenas atualizar) e quais são novas. */
function triggerImportPicker(){
  document.getElementById('import-input').click();
}
async function handleImportFile(event){
  const file = event.target.files[0];
  event.target.value = '';
  if(!file) return;
  if(typeof XLSX === 'undefined'){
    showToast('Não foi possível carregar o leitor de planilhas. Verifique sua conexão com a internet e tente de novo.');
    return;
  }
  showToast('Lendo planilha...');
  try{
    const buffer = await file.arrayBuffer();
    const wb = XLSX.read(buffer, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    if(!rows.length){
      showToast('Não encontrei dados nesta planilha.');
      return;
    }
    const keys = Object.keys(rows[0]);
    const norm = s => s.toString().trim().toLowerCase();
    const lojaKey = keys.find(k=> norm(k)==='loja') || keys.find(k=> norm(k).includes('loja') && !norm(k).includes('id'));
    const municipioKey = keys.find(k=> ['municipio','município'].includes(norm(k))) || keys.find(k=> norm(k).includes('municip'));
    const idKey = keys.find(k=> norm(k).includes('id_loja')) || keys.find(k=> norm(k)==='id');

    if(!lojaKey){
      showToast('Não encontrei uma coluna "Loja" nesta planilha. Verifique o cabeçalho das colunas.');
      return;
    }

    const parsed = rows
      .map(r=>({
        externalId: idKey ? String(r[idKey]||'').trim() : '',
        name: String(r[lojaKey]||'').trim(),
        city: municipioKey ? String(r[municipioKey]||'').trim() : '',
      }))
      .filter(r=> r.name);

    if(!parsed.length){
      showToast('Nenhuma loja com nome válido encontrada na planilha.');
      return;
    }
    openImportPreview(parsed);
  }catch(e){
    showToast('Não foi possível ler este arquivo. Confirme que é uma planilha Excel (.xlsx).');
  }
}
function findClientForImport(p){
  if(p.externalId){
    const byId = DB.clients.find(c=> c.externalId && c.externalId===p.externalId);
    if(byId) return byId;
  }
  return DB.clients.find(c=> c.name.trim().toLowerCase() === p.name.trim().toLowerCase());
}
function openImportPreview(parsed){
  let newCount=0, updateCount=0;
  parsed.forEach(p=>{ findClientForImport(p) ? updateCount++ : newCount++; });
  openConfirmModal({
    title:'Importar Clientes da Planilha',
    message:`Encontramos ${parsed.length} loja(s) no arquivo. ${newCount} nova(s) será(ão) adicionada(s) e ${updateCount} já cadastrada(s) será(ão) atualizada(s) (nome/cidade), sem apagar as visitas já registradas. Deseja continuar?`,
    confirmLabel:'Importar',
    onConfirm: async ()=>{ await runImport(parsed); }
  });
}
async function runImport(parsed){
  let added=0, updated=0;
  parsed.forEach(p=>{
    const existing = findClientForImport(p);
    if(existing){
      existing.name = p.name;
      existing.city = p.city;
      if(p.externalId) existing.externalId = p.externalId;
      updated++;
    } else {
      DB.clients.push({id:uid(), name:p.name, city:p.city, externalId:p.externalId||null, createdAt:new Date().toISOString()});
      added++;
    }
  });
  await saveClients();
  showToast(`Importação concluída: ${added} nova(s), ${updated} atualizada(s).`);
  state.view = 'home';
  render();
}

/* ============================ BACKUP COMPLETO (exportar / importar via arquivo) ============================
   Pensado para uso com o Google Drive: você exporta um arquivo aqui, salva na pasta do
   seu Drive (que já sincroniza sozinha entre os aparelhos), e importa esse mesmo
   arquivo no outro aparelho. Não é sincronização automática — é um "backup manual"
   simples, sem precisar de login, chave de API ou conhecimento técnico. */
async function gatherFullBackup(){
  const visitsByClient = {};
  const photos = {};
  for(const cl of DB.clients){
    const visits = await loadVisits(cl.id);
    visitsByClient[cl.id] = visits;
    for(const v of visits){
      for(const pid of (v.photos||[])){
        const dataUrl = await loadPhotoData(v.id, pid);
        if(dataUrl) photos[v.id+':'+pid] = dataUrl;
      }
    }
  }
  return {
    app: 'Visita a Loja Parceira',
    version: 1,
    exportedAt: new Date().toISOString(),
    clients: DB.clients,
    options: DB.options,
    visits: visitsByClient,
    photos,
  };
}
async function exportBackup(){
  closeMenuUI();
  showToast('Preparando backup...');
  const backup = await gatherFullBackup();
  const json = JSON.stringify(backup, null, 0);
  const dateTag = new Date().toISOString().slice(0,10);
  const filename = `visita-loja-parceira-backup-${dateTag}.json`;

  if(window.showSaveFilePicker){
    // navegadores modernos (desktop): deixa você escolher a pasta do Google Drive direto no salvamento
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{description:'Backup JSON', accept:{'application/json':['.json']}}]
      });
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      await storageSet('app:lastBackupAt', new Date().toISOString());
      showToast('Backup salvo com sucesso.');
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return; // usuário cancelou a escolha da pasta
      // se falhar por outro motivo, cai no método abaixo
    }
  }
  // método padrão (funciona em qualquer navegador, incl. iPhone): baixa o arquivo,
  // depois é só mover/salvar ele na pasta do Google Drive
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  await storageSet('app:lastBackupAt', new Date().toISOString());
  showToast('Backup baixado — mova este arquivo para a pasta do seu Google Drive.');
}

function triggerImportBackupPicker(){
  closeMenuUI();
  document.getElementById('import-backup-input').click();
}
async function handleImportBackupFile(event){
  const file = event.target.files[0];
  event.target.value = '';
  if(!file) return;
  showToast('Lendo backup...');
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.clients) || !data.visits){
      showToast('Este arquivo não parece ser um backup válido deste app.');
      return;
    }
    openImportBackupPreview(data);
  }catch(e){
    showToast('Não foi possível ler este arquivo. Confirme que é um backup .json gerado por este app.');
  }
}
function openImportBackupPreview(data){
  let newClients=0, updatedClients=0, newVisits=0;
  data.clients.forEach(c=>{ findClientForImport(c) ? updatedClients++ : newClients++; });
  Object.entries(data.visits).forEach(([clientId, visits])=>{
    newVisits += visits.length; // contagem aproximada; visitas com mesmo id substituem, não duplicam
  });
  const dataStr = data.exportedAt ? new Date(data.exportedAt).toLocaleString('pt-BR') : 'data desconhecida';
  openConfirmModal({
    title:'Importar Backup',
    message:`Backup de ${dataStr}. ${newClients} cliente(s) novo(s), ${updatedClients} já cadastrado(s) será(ão) atualizado(s), e até ${newVisits} visita(s) serão trazidas. Nada que já existe aqui será apagado — o backup só adiciona ou atualiza. Deseja continuar?`,
    confirmLabel:'Importar Backup',
    onConfirm: async ()=>{ await runImportBackup(data); }
  });
}
async function runImportBackup(data){
  showToast('Importando backup...');
  // 1) opções personalizadas (itens/categorias criados manualmente) — mescla por id OU por nome
  // (itens padrão do app recebem um id novo e aleatório a cada instalação; comparar só por id
  // não detecta que "Decalque" de um aparelho é o mesmo "Decalque" de outro, e duplicava tudo)
  if(data.options){
    Object.keys(data.options).forEach(sectionKey=>{
      if(!DB.options[sectionKey]) DB.options[sectionKey] = [];
      const existing = DB.options[sectionKey];
      (data.options[sectionKey]||[]).forEach(item=>{
        const already = existing.some(i=> i.id===item.id || (i.label||'').trim().toLowerCase()===(item.label||'').trim().toLowerCase());
        if(!already) existing.push(item);
      });
    });
    await saveOptions();
  }
  // 2) clientes — mesma lógica da importação de planilha (por externalId, senão por nome).
  // guarda um mapa "id do cliente no backup" -> "cliente local correspondente", para usar nas visitas a seguir
  const clientIdMap = {};
  data.clients.forEach(c=>{
    const existing = findClientForImport(c);
    if(existing){
      existing.name = c.name;
      existing.city = c.city;
      if(c.externalId) existing.externalId = c.externalId;
      clientIdMap[c.id] = existing;
    } else {
      const newClient = {...c};
      DB.clients.push(newClient);
      clientIdMap[c.id] = newClient;
    }
  });
  await saveClients();
  // 3) visitas — adiciona/atualiza por id, sem remover visitas que só existem neste aparelho
  let visitCount = 0;
  for(const [backupClientId, backupVisits] of Object.entries(data.visits)){
    const cl = clientIdMap[backupClientId];
    if(!cl) continue;
    const localVisits = await loadVisits(cl.id);
    backupVisits.forEach(bv=>{
      const idx = localVisits.findIndex(lv=>lv.id===bv.id);
      if(idx>-1) localVisits[idx] = bv; else localVisits.push(bv);
      visitCount++;
    });
    VISITS_CACHE[cl.id] = localVisits;
    await saveVisits(cl.id);
    // 4) fotos referenciadas por essas visitas
    for(const bv of backupVisits){
      for(const pid of (bv.photos||[])){
        const key = bv.id+':'+pid;
        if(data.photos && data.photos[key]){
          const already = await loadPhotoData(bv.id, pid);
          if(!already) await savePhotoData(bv.id, pid, data.photos[key]);
        }
      }
    }
  }
  showToast(`Backup importado: ${visitCount} visita(s) trazidas.`);
  state.view = 'home';
  render();
}

function normalizeSearch(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}
function filterClientSuggestions(query){
  const results = document.getElementById('client-search-results');
  if(!results) return;
  const q = normalizeSearch(query);
  let matches;
  if(!q){
    matches = DB.clients.slice(0, 8); // sem digitar nada ainda, mostra os primeiros só pra dar um empurrão
  } else {
    matches = DB.clients.filter(cl=>
      normalizeSearch(cl.name).includes(q) || normalizeSearch(cl.city).includes(q)
    ).slice(0, 25);
  }
  const itemsHtml = matches.map(cl=>
    `<div class="client-suggestion" onmousedown="selectClientFromSearch('${cl.id}')">
      <span class="cs-name">${esc(cl.name)}</span>${cl.city?`<span class="cs-city">${esc(cl.city)}</span>`:''}
    </div>`
  ).join('');
  const emptyMsg = (q && matches.length===0) ? `<div class="client-suggestion client-suggestion-empty">Nenhum cliente encontrado com "${esc(query)}"</div>` : '';
  results.innerHTML = itemsHtml + emptyMsg + `<div class="client-suggestion client-suggestion-new" onmousedown="selectClientFromSearch('__new__')">+ Adicionar novo cliente...</div>`;
  results.style.display = 'block';
}
function hideClientSuggestions(){
  setTimeout(()=>{
    const results = document.getElementById('client-search-results');
    if(results) results.style.display = 'none';
  }, 180); // atraso pequeno para o clique na sugestão (onmousedown) registrar antes do input perder o foco
}
async function selectClientFromSearch(clientId){
  const results = document.getElementById('client-search-results');
  if(results) results.style.display = 'none';
  if(clientId === '__new__'){
    openAddClientModal(async (cl)=>{
      state.currentVisit.clientId = cl.id;
      state.currentVisit.clientName = cl.name;
      state.currentClientId = cl.id;
      state.previousPendingIds = await loadPreviousVisitPending(cl.id, state.editingVisitId);
      render();
    });
    return;
  }
  const cl = DB.clients.find(c=>c.id===clientId);
  if(cl){
    state.currentVisit.clientId = cl.id;
    state.currentVisit.clientName = cl.name;
    state.currentClientId = cl.id;
    state.previousPendingIds = await loadPreviousVisitPending(cl.id, state.editingVisitId);
  }
  render();
}

function renderSection(s, v){
  const opts = DB.options[s.key] || [];
  const open = !!state.openSections[s.key];
  const total = sectionTotal(s.key);
  const prevPending = state.previousPendingIds || new Set();

  const rowsHtml = opts.map(item=>{
    if(item.subitems && item.subitems.length){
      const gKey = s.key+'|'+item.id;
      const gOpen = !!state.openGroups[gKey];
      const subChecked = item.subitems.filter(su=> getAnswer(v, s.key, su.id)==='yes').length;
      const subRows = item.subitems.map(su=>{
        const ans = getAnswer(v, s.key, su.id);
        const wasPending = prevPending.has(su.id);
        return `<div class="check-row">
          <label>${esc(su.label)}${wasPending?' <span class="prev-pending-tag" title="Estava pendente na visita anterior">↺ antes</span>':''}</label>
          ${renderAnswerSelect(s.key, su.id, ans)}
        </div>`;
      }).join('');
      return `
      <div class="group ${gOpen?'open':''}">
        <div class="group-row" onclick="toggleGroup('${gKey}')">
          <span class="group-toggle">▸</span>
          <span class="group-label">${esc(item.label)}</span>
          <span class="group-badge">${subChecked}/${item.subitems.length}</span>
        </div>
        <div class="group-body">
          ${subRows}
          <button class="add-subitem-btn" onclick="openAddSubitemModal('${s.key}','${item.id}')">+ Adicionar Subitem</button>
        </div>
      </div>`;
    } else {
      const ans = getAnswer(v, s.key, item.id);
      const wasPending = prevPending.has(item.id);
      const qtyBox = item.qty
        ? `<input type="number" min="0" inputmode="numeric" class="qty-input" placeholder="Qtd" value="${(v.qty && v.qty[item.id]!==undefined) ? v.qty[item.id] : ''}" oninput="updateItemQty('${item.id}', this.value)">`
        : '';
      return `<div class="check-row">
        <label>${esc(item.label)}${wasPending?' <span class="prev-pending-tag" title="Estava pendente na visita anterior">↺ antes</span>':''}</label>
        ${qtyBox}
        ${renderAnswerSelect(s.key, item.id, ans)}
      </div>`;
    }
  }).join('');

  const noteVal = v.notes[s.key] || '';
  const hasPositive = opts.some(item=> leavesOf(item).some(l=> l.flag==='positive'));
  const hasNeed = opts.some(item=> leavesOf(item).some(l=> l.flag==='need'));
  const sectionClass = hasPositive ? 'scored' : (hasNeed ? 'needs' : '');
  const addOpen = !!(state.addOptionsOpen && state.addOptionsOpen[s.key]);
  return `
  <div class="section ${sectionClass} ${open?'open':''}">
    <div class="section-head" onclick="toggleSection('${s.key}')">
      <div class="section-num">${s.num}</div>
      <div class="section-title">${s.title}</div>
      <div class="section-progress">${sectionChecked(v, s.key)}/${total}</div>
      <div class="section-arrow">⌄</div>
    </div>
    <div class="section-body">
      ${rowsHtml || '<div class="empty" style="padding:14px 0;">Nenhum item cadastrado ainda.</div>'}
      <div class="add-toggle-row">
        <button class="add-toggle ${addOpen?'open':''}" onclick="toggleAddOptions('${s.key}')" title="Adicionar item ou categoria">⌄</button>
      </div>
      ${addOpen ? `
      <div class="btn-row">
        <button class="add-item-btn" onclick="openAddItemModal('${s.key}')">+ Novo Item</button>
        <button class="add-item-btn" onclick="openAddGroupModal('${s.key}')">+ Categoria com Subitens</button>
      </div>` : ''}
      <textarea style="margin-top:10px" placeholder="Observações sobre ${esc(s.title.toLowerCase())}..." oninput="updateSectionNote('${s.key}', this.value)">${esc(noteVal)}</textarea>
    </div>
  </div>`;
}

async function finishVisit(){
  const v = state.currentVisit;
  if(!v.clientId){
    showToast('Selecione o cliente da visita antes de concluir.');
    window.scrollTo(0,0);
    return;
  }
  v.score = presencaScore(v);

  // grava cada foto em sua própria chave e apaga as que foram removidas durante a edição
  const removedIds = v._removedPhotoIds || [];
  for(const pid of removedIds){
    await deletePhotoData(v.id, pid);
  }
  const draftPhotos = Array.isArray(v.photos) ? v.photos : [];
  for(const photo of draftPhotos){
    await savePhotoData(v.id, photo.id, photo.dataUrl);
  }
  v.photos = draftPhotos.map(photo=>photo.id); // no registro salvo, só as referências (leve)
  delete v._removedPhotoIds;

  const list = await loadVisits(v.clientId);
  const wasEditing = !!state.editingVisitId;
  if(wasEditing){
    const idx = list.findIndex(x=>x.id===state.editingVisitId);
    if(idx>-1) list[idx] = v; else list.push(v);
  } else {
    list.push(v);
  }
  await saveVisits(v.clientId);
  state.currentClientId = v.clientId;
  state.currentVisit = null;
  state.editingVisitId = null;
  state.view = 'detail';
  state.lastDetailId = v.id;
  showToast(wasEditing ? 'Visita atualizada com sucesso' : 'Visita salva com sucesso');
  render();
}

/* ---- EDITAR VISITA JÁ REGISTRADA ---- */
async function editVisit(visitId){
  const cl = DB.clients.find(c=>c.id===state.currentClientId);
  const visits = await loadVisits(cl.id);
  const original = visits.find(x=>x.id===visitId);
  if(!original) return;
  state.currentVisit = JSON.parse(JSON.stringify(original)); // rascunho editável, não afeta o registro até salvar
  state.currentVisit._removedPhotoIds = [];
  // as fotos já salvas ficam em chaves próprias; carrega o conteúdo de cada uma para exibir no rascunho
  const savedPhotoIds = Array.isArray(original.photos) ? original.photos : [];
  const loadedPhotos = [];
  for(const pid of savedPhotoIds){
    const dataUrl = await loadPhotoData(visitId, pid);
    if(dataUrl) loadedPhotos.push({id: pid, dataUrl});
  }
  state.currentVisit.photos = loadedPhotos;
  if(!state.currentVisit.qty) state.currentVisit.qty = {};
  state.editingVisitId = visitId;
  state.openSections = {presenca:true};
  state.openGroups = {};
  state.previousPendingIds = await loadPreviousVisitPending(cl.id, visitId);
  state.view = 'visit';
  render();
}

function confirmDeleteVisit(visitId){
  openConfirmModal({
    title:'Excluir Visita',
    message:'Essa ação não pode ser desfeita. Os dados desta visita (checklist, observações, fotos e relatório) serão apagados permanentemente.',
    confirmLabel:'Excluir Visita',
    danger:true,
    onConfirm: async ()=>{
      const cl = DB.clients.find(c=>c.id===state.currentClientId);
      const list = await loadVisits(cl.id);
      const idx = list.findIndex(x=>x.id===visitId);
      if(idx>-1){
        const removed = list[idx];
        for(const pid of (removed.photos||[])){
          await deletePhotoData(visitId, pid);
        }
        list.splice(idx,1);
      }
      await saveVisits(cl.id);
      showToast('Visita excluída');
      state.view = 'history';
      render();
    }
  });
}

/* ---- LIMPAR CADASTROS INVÁLIDOS (nomes de código, de importações com problema) ----
   Detecta clientes cujo "nome" parece, na verdade, um código interno (ex: "3883aea9",
   "CL34EN108") — o tipo de erro que acontece quando uma planilha usa nomes de coluna
   diferentes do esperado e o app lê a coluna errada como nome do cliente. */
function looksLikeImportCode(name){
  const n = (name||'').trim();
  if(!n || n.includes(' ')) return false; // nomes reais de loja quase sempre têm espaço
  if(/^[0-9a-f]{6,10}$/i.test(n)) return true;           // hash tipo "3883aea9"
  if(/^[a-z]{1,4}\d{2,6}[a-z]{0,4}\d{0,6}$/i.test(n)) return true; // código tipo "CL34EN108"
  return false;
}
function openCleanupBadImports(){
  closeMenuUI();
  const candidates = DB.clients.filter(c=> looksLikeImportCode(c.name));
  if(!candidates.length){
    showToast('Nenhum cliente com nome de código encontrado — nada para limpar.');
    return;
  }
  const sample = candidates.slice(0,5).map(c=>c.name).join(', ');
  const extra = candidates.length>5 ? ` e mais ${candidates.length-5}...` : '';
  openConfirmModal({
    title:'Limpar Cadastros Inválidos',
    message:`Encontrei ${candidates.length} cliente(s) com nome parecido com código (ex: ${sample}${extra}). Isso costuma acontecer quando uma coluna errada da planilha é lida como nome. Serão apagados permanentemente, junto com visitas e fotos associadas a eles, se houver. Deseja continuar?`,
    confirmLabel:`Excluir ${candidates.length} cliente(s)`,
    danger:true,
    onConfirm: async ()=>{ await bulkDeleteClients(candidates); }
  });
}
async function bulkDeleteClients(clients){
  showToast('Removendo...');
  for(const cl of clients){
    const visits = await loadVisits(cl.id);
    for(const v of visits){
      for(const pid of (v.photos||[])){
        await deletePhotoData(v.id, pid);
      }
    }
    await storageDelete('visits:'+cl.id);
    delete VISITS_CACHE[cl.id];
  }
  const idsToRemove = new Set(clients.map(c=>c.id));
  DB.clients = DB.clients.filter(c=> !idsToRemove.has(c.id));
  await saveClients();
  showToast(`${clients.length} cliente(s) removido(s) com sucesso.`);
  state.view = 'home';
  state.currentClientId = null;
  render();
}

/* ---- EXCLUIR CLIENTE (com todas as visitas) ----
   Antes de apagar, todas as fotos de todas as visitas do cliente são reunidas
   num arquivo .zip e baixadas — assim o registro fotográfico não se perde,
   mesmo depois do cliente ser removido do app. */
async function confirmDeleteClient(clientId){
  const cl = DB.clients.find(c=>c.id===clientId);
  if(!cl) return;
  const visits = await loadVisits(clientId);
  let photoCount = 0;
  visits.forEach(v=> photoCount += (v.photos||[]).length);

  const photoNote = photoCount>0
    ? `Antes de excluir, ${photoCount} foto(s) desse cliente serão baixadas num arquivo .zip, para você não perder o registro.`
    : 'Este cliente não tem fotos registradas.';

  openConfirmModal({
    title:'Excluir Cliente e Todos os Dados',
    message:`Essa ação não pode ser desfeita. Serão apagados permanentemente: o cadastro de "${cl.name}", suas ${visits.length} visita(s), checklists e observações. ${photoNote}`,
    confirmLabel:'Excluir Cliente',
    danger:true,
    onConfirm: async ()=>{ await deleteClientWithPhotoExport(cl, visits); }
  });
}
async function deleteClientWithPhotoExport(cl, visits){
  showToast('Preparando...');

  // 1) reúne todas as fotos de todas as visitas deste cliente
  const photoFiles = []; // {name, dataUrl}
  for(const v of visits){
    const pids = v.photos || [];
    for(let i=0; i<pids.length; i++){
      const dataUrl = await loadPhotoData(v.id, pids[i]);
      if(dataUrl){
        const safeDate = (v.date||'sem-data');
        photoFiles.push({ name: `${safeDate}_foto${i+1}.jpg`, dataUrl });
      }
    }
  }

  // 2) se houver fotos, empacota num .zip e baixa (ou deixa escolher a pasta, se o navegador suportar)
  if(photoFiles.length){
    if(typeof JSZip === 'undefined'){
      showToast('Não foi possível preparar o arquivo de fotos (biblioteca não carregada). Verifique sua internet e tente de novo.');
      return;
    }
    const zip = new JSZip();
    const folder = zip.folder(cl.name.replace(/[\\/:*?"<>|]/g, '-'));
    photoFiles.forEach(pf=>{
      const base64 = pf.dataUrl.split(',')[1];
      folder.file(pf.name, base64, {base64:true});
    });
    const blob = await zip.generateAsync({type:'blob'});
    const filename = `fotos-${cl.name.replace(/[\\/:*?"<>|]/g, '-')}-${new Date().toISOString().slice(0,10)}.zip`;

    let saved = false;
    if(window.showSaveFilePicker){
      try{
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{description:'Arquivo ZIP', accept:{'application/zip':['.zip']}}]
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        saved = true;
      }catch(e){
        if(e && e.name === 'AbortError'){
          showToast('Exclusão cancelada — as fotos não foram baixadas.');
          return;
        }
      }
    }
    if(!saved){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }
    showToast('Fotos baixadas. Excluindo cliente...');
  }

  // 3) apaga as fotos salvas, as visitas e o cadastro do cliente
  for(const v of visits){
    for(const pid of (v.photos||[])){
      await deletePhotoData(v.id, pid);
    }
  }
  await storageDelete('visits:'+cl.id);
  delete VISITS_CACHE[cl.id];
  DB.clients = DB.clients.filter(c=> c.id !== cl.id);
  await saveClients();

  showToast('Cliente excluído.');
  state.currentClientId = null;
  state.view = 'home';
  render();
}

async function buildReportContent(cl, v){
  const p = presencaScore(v);

  function flatLeafItems(sectionKey){
    const labels = [];
    (DB.options[sectionKey]||[]).forEach(item=>{
      leavesOf(item).forEach(leaf=>{
        if(getAnswer(v, sectionKey, leaf.id)==='yes'){
          labels.push(item.subitems && item.subitems.length ? `${item.label} · ${leaf.label}` : leaf.label);
        }
      });
    });
    return labels;
  }

  const blocksHtml = SECTIONS.map(s=>{
    const total = sectionTotal(s.key);
    const checked = sectionChecked(v, s.key);
    const items = flatLeafItems(s.key);
    const note = v.notes[s.key];
    return `
      <div class="rp-block-row"><span>${s.num}. ${esc(s.title)}</span><span class="data">${checked}/${total}</span></div>
      ${items.length? `<div>${items.map(t=>`<span class="rp-pill">${esc(t)}</span>`).join('')}</div>`:''}
      ${note? `<div class="rp-note">Obs.: ${esc(note)}</div>`:''}
    `;
  }).join('');

  const starsHtml = '★'.repeat(v.stars) + '☆'.repeat(5-v.stars);
  const geradoEm = new Date().toLocaleDateString('pt-BR');
  const needs = improvementNeeds(v);
  const needsHtml = needs.length ? needs.map(n=>
    `<div class="rp-need-row"><span class="rp-need-dot"></span><div><b>${esc(n.label)}</b><div class="rp-need-section">${esc(n.section)}</div></div></div>`
  ).join('') : '';

  const photoIds = Array.isArray(v.photos) ? v.photos : [];
  const photoDataUrls = [];
  for(const pid of photoIds){
    const dataUrl = await loadPhotoData(v.id, pid);
    if(dataUrl) photoDataUrls.push(dataUrl);
  }
  const photosHtml = photoDataUrls.length
    ? `<h2>Fotos da Visita</h2><div class="rp-photo-grid">${photoDataUrls.map(url=>`<img src="${url}" class="rp-photo">`).join('')}</div>`
    : '';

  return `
    <div class="report-page">
      <div class="rp-brand">Relatório de Auditoria de Ponto de Venda</div>
      <h1>${esc(cl.name)}</h1>
      <div class="rp-meta">
        ${cl.city? `<b>${esc(cl.city)}</b> · `:''}Visita realizada em <b>${fmtDate(v.date)}</b> · Relatório gerado em ${geradoEm}
      </div>

      <div class="rp-score-row">
        <div>
          <div class="rp-score-num">${p}%</div>
          <div class="rp-score-lbl">Índice de<br>Presença e Atendimento</div>
        </div>
        <div style="flex:1;border-left:1px solid #DCDFE1;padding-left:16px;">
          <div class="rp-score-lbl">Avaliação geral da visita</div>
          <div class="rp-stars">${starsHtml}</div>
        </div>
      </div>

      ${v.avalObs? `<h2>Observações Gerais</h2><div class="rp-obs">${esc(v.avalObs)}</div>`:''}

      ${needs.length? `<h2>⚠️ Necessidades de Melhoria</h2><div class="rp-needs-box">${needsHtml}</div>`:''}

      <h2>Cobertura por Bloco de Auditoria</h2>
      ${blocksHtml}

      ${photosHtml}

      <div class="rp-footer">Relatório gerado automaticamente pelo app de Visita a Loja Parceira · ${esc(cl.name)}</div>
    </div>
  `;
}
